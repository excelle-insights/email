<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{subject}}</title>
</head>
<body style="margin:0; background:#f4f4f6; font-family:Arial, Helvetica, sans-serif; color:#222;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f6; padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; padding:32px;">
                    <tr><td style="font-size:20px; font-weight:bold;">{{site_title}}</td></tr>
                    <tr><td style="font-size:18px; padding-top:16px;">Welcome{{#first_name}}, {{first_name}}{{/first_name}}!</td></tr>
                    <tr><td style="padding:16px 0; line-height:1.6;">We are glad you joined {{site_title}}.</td></tr>
                    {{#action_url}}
                    <tr><td style="padding-top:8px;">
                        <a href="{{action_url}}" style="background:#2563eb; color:#ffffff; padding:10px 18px; border-radius:4px; text-decoration:none;">{{action_label}}</a>
                    </td></tr>
                    {{/action_url}}
                    <tr><td style="padding-top:24px; font-size:12px; color:#777;">&copy; {{year}} {{site_title}}</td></tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
